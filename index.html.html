<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Endless Runner</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #222;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
  }
  canvas {
    background: #87CEEB;
    display: block;
    max-width: 100%;
    max-height: 100%;
    image-rendering: pixelated;
  }
</style>
</head>
<body>

<canvas id="gameCanvas" width="900" height="500"></canvas>

<script>
(function () {
  "use strict";

  // -----------------------------
  // CANVAS
  // -----------------------------

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const WIDTH = canvas.width;   // 900
  const HEIGHT = canvas.height; // 500

  // -----------------------------
  // COLORS  (mirrors the pygame RGB tuples)
  // -----------------------------

  const SKY = "rgb(135, 206, 235)";
  const GROUND = "rgb(46, 204, 113)";
  const PLAYER_COLOR = "rgb(52, 152, 219)";
  const OBSTACLE_COLOR = "rgb(231, 76, 60)";   // ground obstacle -> jump over
  const OVERHEAD_COLOR = "rgb(155, 89, 182)";  // overhead obstacle -> duck under
  const WHITE = "rgb(255, 255, 255)";
  const BLACK = "rgb(30, 30, 30)";

  // -----------------------------
  // AUDIO  (Web Audio API — synthesized, no files)
  // -----------------------------
  // Mirrors make_chirp() from the pygame version: a short sine sweep
  // from start_freq to end_freq with a linear fade-out so it never
  // clicks at the end.

  let audioCtx = null;

  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playChirp(startFreq, endFreq, durationMs, volume) {
    const ac = getAudioContext();
    // Browsers suspend audio until a user gesture; resume defensively.
    if (ac.state === "suspended") ac.resume();

    const duration = durationMs / 1000;
    const osc = ac.createOscillator();
    const gain = ac.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(startFreq, ac.currentTime);
    osc.frequency.linearRampToValueAtTime(endFreq, ac.currentTime + duration);

    gain.gain.setValueAtTime(volume, ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.0001, ac.currentTime + duration);

    osc.connect(gain);
    gain.connect(ac.destination);

    osc.start();
    osc.stop(ac.currentTime + duration);
  }

  function playJumpSound() { playChirp(300, 750, 140, 0.4); }
  function playDuckSound() { playChirp(220, 120, 110, 0.4); }
  function playDirectionSound() { playChirp(500, 500, 45, 0.3); }

  // -----------------------------
  // PLAYER
  // -----------------------------

  const playerWidth = 45;
  const playerHeight = 60;
  const duckHeight = 35;

  const groundY = HEIGHT - 100;

  let playerX = 100;
  let playerY = groundY;

  const playerSpeed = 7;

  let velocityY = 0;
  const gravity = 0.8;
  const jumpPower = -15;

  let jumping = false;
  let ducking = false;

  // Tracks current horizontal movement direction ("left", "right", or
  // null) so a sound only plays when the direction actually changes,
  // not on every frame a key is held — matches the pygame version.
  let lastDirection = null;

  // -----------------------------
  // OBSTACLES
  // -----------------------------

  let obstacles = [];

  // Ground obstacle: full player height, must be jumped.
  const groundObstacleWidth = 40;
  const groundObstacleHeight = 60;

  // Overhead obstacle: hangs at head height, must be ducked under.
  // Its bottom edge sits just above where the ducking hitbox begins,
  // so a ducking player passes cleanly underneath, while a standing
  // player's head-height collides with it.
  const overheadObstacleWidth = 50;
  const overheadObstacleHeight = 35;
  const overheadGapAboveGround = 20; // clearance between obstacle bottom and groundY

  let obstacleSpeed = 7;
  let spawnTimer = 0;
  let nextSpawnAt = randInt(70, 120);

  // -----------------------------
  // SCORE / STATE
  // -----------------------------

  let score = 0;
  let gameRunning = true;
  let playerRect = { x: playerX, y: playerY, w: playerWidth, h: playerHeight };

  // -----------------------------
  // HELPERS
  // -----------------------------

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function rectsOverlap(a, b) {
    return (
      a.x < b.x + b.w &&
      a.x + a.w > b.x &&
      a.y < b.y + b.h &&
      a.y + a.h > b.y
    );
  }

  // -----------------------------
  // CREATE OBSTACLE
  // -----------------------------

  function createObstacle() {
    const x = WIDTH + randInt(0, 200);

    // ~55% ground obstacles, ~45% overhead obstacles
    if (Math.random() < 0.55) {
      obstacles.push({
        x: x,
        y: groundY,
        w: groundObstacleWidth,
        h: groundObstacleHeight,
        type: "ground"
      });
    } else {
      // Bottom edge stops short of the ground so there's a
      // duck-sized gap beneath it.
      const bottomY = groundY + overheadGapAboveGround;
      const y = bottomY - overheadObstacleHeight;
      obstacles.push({
        x: x,
        y: y,
        w: overheadObstacleWidth,
        h: overheadObstacleHeight,
        type: "overhead"
      });
    }
  }

  // -----------------------------
  // RESET GAME
  // -----------------------------

  function resetGame() {
    playerX = 100;
    playerY = groundY;
    velocityY = 0;

    jumping = false;
    ducking = false;
    lastDirection = null;

    obstacles = [];
    score = 0;
    obstacleSpeed = 7;
    spawnTimer = 0;
    nextSpawnAt = randInt(70, 120);

    gameRunning = true;
  }

  // -----------------------------
  // INPUT
  // -----------------------------

  const keys = {
    left: false,
    right: false
  };

  window.addEventListener("keydown", (e) => {
    switch (e.code) {
      case "ArrowUp":
        e.preventDefault();
        if (gameRunning && !jumping) {
          velocityY = jumpPower;
          jumping = true;
          playJumpSound();
        }
        break;

      case "ArrowDown":
        e.preventDefault();
        if (gameRunning && !ducking) {
          playDuckSound();
        }
        ducking = true;
        break;

      case "ArrowLeft":
        e.preventDefault();
        keys.left = true;
        if (gameRunning && lastDirection !== "left") {
          playDirectionSound();
        }
        lastDirection = "left";
        break;

      case "ArrowRight":
        e.preventDefault();
        keys.right = true;
        if (gameRunning && lastDirection !== "right") {
          playDirectionSound();
        }
        lastDirection = "right";
        break;

      case "KeyR":
        if (!gameRunning) {
          resetGame();
        }
        break;
    }
  });

  window.addEventListener("keyup", (e) => {
    switch (e.code) {
      case "ArrowDown":
        ducking = false;
        break;

      case "ArrowLeft":
        keys.left = false;
        if (lastDirection === "left") lastDirection = null;
        break;

      case "ArrowRight":
        keys.right = false;
        if (lastDirection === "right") lastDirection = null;
        break;
    }
  });

  // -----------------------------
  // UPDATE
  // -----------------------------

  function update() {
    if (!gameRunning) return;

    // LEFT / RIGHT movement
    if (keys.left) playerX -= playerSpeed;
    if (keys.right) playerX += playerSpeed;

    // Keep player inside screen
    if (playerX < 0) playerX = 0;
    if (playerX > WIDTH - playerWidth) playerX = WIDTH - playerWidth;

    // Jump physics
    velocityY += gravity;
    playerY += velocityY;

    // Ground collision
    if (playerY >= groundY) {
      playerY = groundY;
      velocityY = 0;
      jumping = false;
    }

    // Player hitbox — ducking only changes it while grounded, and
    // shrinks it from the top down (removes head height), which is
    // what lets it pass under overhead obstacles while still
    // colliding with ground ones.
    const currentHeight = (ducking && !jumping) ? duckHeight : playerHeight;
    playerRect = {
      x: playerX,
      y: playerY + (playerHeight - currentHeight),
      w: playerWidth,
      h: currentHeight
    };

    // Spawn obstacles
    spawnTimer += 1;
    if (spawnTimer > nextSpawnAt) {
      createObstacle();
      spawnTimer = 0;
      nextSpawnAt = randInt(70, 120);
    }

    // Move obstacles
    for (const ob of obstacles) {
      ob.x -= obstacleSpeed;
    }
    obstacles = obstacles.filter((ob) => ob.x + ob.w > 0);

    // Collision
    for (const ob of obstacles) {
      if (rectsOverlap(playerRect, ob)) {
        gameRunning = false;
      }
    }

    // Score + difficulty ramp
    score += 0.1;
    obstacleSpeed += 0.001;
  }

  // -----------------------------
  // DRAW
  // -----------------------------

  function draw() {
    // Background
    ctx.fillStyle = SKY;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Clouds
    ctx.fillStyle = WHITE;
    circle(150, 100, 30);
    circle(180, 100, 40);
    circle(215, 100, 30);

    // Ground
    ctx.fillStyle = GROUND;
    ctx.fillRect(0, HEIGHT - 100, WIDTH, 100);

    // Player
    roundRect(playerRect.x, playerRect.y, playerRect.w, playerRect.h, 8, PLAYER_COLOR);

    // Player eye
    ctx.fillStyle = WHITE;
    circle(playerX + 32, playerRect.y + 15, 5);

    // Obstacles
    for (const ob of obstacles) {
      const color = ob.type === "ground" ? OBSTACLE_COLOR : OVERHEAD_COLOR;
      roundRect(ob.x, ob.y, ob.w, ob.h, 5, color);
    }

    // Score
    ctx.fillStyle = BLACK;
    ctx.font = "28px Arial";
    ctx.textBaseline = "top";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + Math.floor(score), 20, 20);

    // Controls hint
    ctx.textAlign = "right";
    ctx.fillText("\u2191 Jump   \u2193 Duck   \u2190 \u2192 Move", WIDTH - 20, 20);
    ctx.textAlign = "left";

    // Game over overlay
    if (!gameRunning) {
      ctx.fillStyle = "rgba(30, 30, 30, 0.6)";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      ctx.fillStyle = WHITE;
      ctx.textAlign = "center";

      ctx.font = "bold 56px Arial";
      ctx.fillText("GAME OVER", WIDTH / 2, 170);

      ctx.font = "28px Arial";
      ctx.fillText("Score: " + Math.floor(score), WIDTH / 2, 250);
      ctx.fillText("Press R to Restart", WIDTH / 2, 300);

      ctx.textAlign = "left";
    }
  }

  function circle(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // -----------------------------
  // MAIN LOOP  (60fps target, matching clock.tick(60))
  // -----------------------------

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
