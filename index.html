<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DRIFT — Neon Runner</title>
<style>
  :root{
    --bg-void:#0a0618;
    --bg-deep:#150c2e;
    --grid-line:#2d1b5e;
    --cyan:#4ff2e0;
    --cyan-dim:#1e8c81;
    --magenta:#ff3ea5;
    --magenta-dim:#8c1f5c;
    --amber:#ffcb47;
    --violet:#7b5cff;
    --fog:#e8e2ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg-void);
    font-family:'Courier New', ui-monospace, monospace;
    touch-action:none;
    user-select:none;
  }
  #stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(123,92,255,0.25), transparent 60%),
      var(--bg-void);
  }
  #gameCanvas{
    display:block;
    background:linear-gradient(180deg, var(--bg-void) 0%, var(--bg-deep) 55%, #1a0f38 100%);
    max-width:100%;
    max-height:100%;
    box-shadow: 0 0 0 1px rgba(123,92,255,0.3), 0 0 60px rgba(123,92,255,0.15);
  }

  .hud{
    position:absolute; top:14px; left:0; right:0;
    display:flex; justify-content:space-between;
    padding:0 18px;
    pointer-events:none;
    color:var(--fog);
    letter-spacing:2px;
    font-size:13px;
    text-shadow:0 0 8px rgba(79,242,224,0.6);
  }
  .hud .label{ color:var(--cyan-dim); font-size:10px; display:block; letter-spacing:3px;}
  .hud .value{ font-size:20px; color:var(--cyan); font-weight:bold; }
  .hud .right{ text-align:right; }
  .hud .right .value{ color:var(--amber); }

  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    color:var(--fog);
    background:radial-gradient(ellipse at 50% 40%, rgba(21,12,46,0.55), rgba(10,6,24,0.92));
    backdrop-filter: blur(2px);
    transition:opacity 0.25s ease;
  }
  .overlay.hidden{ display:none; }

  .title{
    font-size:clamp(38px, 9vw, 64px);
    font-weight:900;
    letter-spacing:10px;
    margin:0;
    color:var(--fog);
    text-shadow:
      0 0 10px var(--cyan),
      0 0 30px var(--magenta),
      0 0 60px rgba(123,92,255,0.6);
  }
  .subtitle{
    margin:6px 0 30px;
    color:var(--violet);
    letter-spacing:6px;
    font-size:11px;
    text-transform:uppercase;
  }
  .prompt{
    margin-top:26px;
    font-size:13px;
    letter-spacing:2px;
    color:var(--cyan);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .stat-row{ display:flex; gap:40px; margin-top:10px; }
  .stat{ display:flex; flex-direction:column; align-items:center; }
  .stat .label{ font-size:10px; letter-spacing:3px; color:var(--cyan-dim); margin-bottom:4px;}
  .stat .value{ font-size:34px; font-weight:900; color:var(--amber); text-shadow:0 0 14px rgba(255,203,71,0.6);}
  .stat.hi .value{ color:var(--magenta); text-shadow:0 0 14px rgba(255,62,165,0.6); }

  .newbest{
    margin-top:14px;
    color:var(--magenta);
    letter-spacing:3px;
    font-size:12px;
    text-shadow:0 0 10px var(--magenta);
    animation:pulse 1s ease-in-out infinite;
  }

  .controls-hint{
    margin-top:34px;
    font-size:10px;
    letter-spacing:1.5px;
    color:#5a4d8c;
    line-height:1.8;
  }
  .controls-hint b{ color:var(--violet); }

  .btn{
    margin-top:22px;
    padding:12px 34px;
    background:transparent;
    border:1px solid var(--cyan);
    color:var(--cyan);
    font-family:inherit;
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:0 0 16px rgba(79,242,224,0.25);
    transition:all 0.15s ease;
  }
  .btn:hover, .btn:active{
    background:var(--cyan);
    color:var(--bg-void);
    box-shadow:0 0 24px rgba(79,242,224,0.6);
  }

  .pause-icon{
    position:absolute; top:14px; right:16px;
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    color:var(--cyan-dim);
    font-size:16px;
    cursor:pointer;
    pointer-events:all;
    z-index:5;
  }

  .credit{
    position:absolute; bottom:8px; left:0; right:0;
    text-align:center;
    font-size:9px;
    letter-spacing:2px;
    color:#3d3266;
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="gameCanvas"></canvas>

  <div class="hud" id="hud" style="display:none;">
    <div class="left">
      <span class="label">DISTANCE</span>
      <span class="value" id="scoreVal">0</span>
    </div>
    <div class="right">
      <span class="label">BEST</span>
      <span class="value" id="bestVal">0</span>
    </div>
  </div>

  <div class="pause-icon" id="pauseBtn" style="display:none;">II</div>

  <div class="overlay" id="startScreen">
    <h1 class="title">DRIFT</h1>
    <p class="subtitle">— neon grid runner —</p>
    <button class="btn" id="startBtn">Start Run</button>
    <div class="controls-hint">
      <b>SPACE / TAP</b> jump &nbsp;·&nbsp; <b>↓ / SWIPE DOWN</b> slide<br>
      Clip a hazard and the run ends. Keep your line.
    </div>
  </div>

  <div class="overlay hidden" id="gameOverScreen">
    <h1 class="title" style="font-size:clamp(28px,7vw,44px); letter-spacing:6px;">RUN ENDED</h1>
    <div class="stat-row">
      <div class="stat">
        <span class="label">DISTANCE</span>
        <span class="value" id="finalScore">0</span>
      </div>
      <div class="stat hi">
        <span class="label">BEST</span>
        <span class="value" id="finalBest">0</span>
      </div>
    </div>
    <div class="newbest hidden" id="newBestTag">◆ NEW BEST ◆</div>
    <button class="btn" id="restartBtn">Run Again</button>
  </div>

  <div class="overlay hidden" id="pauseScreen">
    <h1 class="title" style="font-size:clamp(28px,7vw,44px);">PAUSED</h1>
    <button class="btn" id="resumeBtn">Resume</button>
  </div>

  <div class="credit">DRIFT · endless neon runner</div>
</div>

<script>
(function(){
  "use strict";

  // ---------- Canvas setup ----------
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const DESIGN_W = 800, DESIGN_H = 450;
  canvas.width = DESIGN_W;
  canvas.height = DESIGN_H;

  function resizeCanvas(){
    const stage = document.getElementById('stage');
    const availW = window.innerWidth;
    const availH = window.innerHeight;
    const scale = Math.min(availW / DESIGN_W, availH / DESIGN_H);
    canvas.style.width = (DESIGN_W * scale) + 'px';
    canvas.style.height = (DESIGN_H * scale) + 'px';
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ---------- Game constants ----------
  const GROUND_Y = 340;
  const GRAVITY = 2200;
  const JUMP_VELOCITY = -780;
  const BASE_SPEED = 320;
  const MAX_SPEED = 760;
  const SPEED_RAMP = 4.2; // px/s^2 increase over time
  const PLAYER_X = 130;

  // ---------- State ----------
  let state = 'start'; // start, playing, paused, gameover
  let lastTime = 0;
  let elapsed = 0;
  let score = 0;
  let best = 0;
  let speed = BASE_SPEED;
  let shakeTime = 0;
  let shakeMag = 0;
  let themeIndex = 0;

  const THEMES = [
    { grid:'#2d1b5e', accentA:'#4ff2e0', accentB:'#ff3ea5', sky1:'#0a0618', sky2:'#150c2e', sky3:'#1a0f38' },
    { grid:'#3a1b4e', accentA:'#ffcb47', accentB:'#7b5cff', sky1:'#0a0410', sky2:'#26102e', sky3:'#38103a' },
    { grid:'#123a3e', accentA:'#4ff2e0', accentB:'#ffcb47', sky1:'#04100f', sky2:'#0c2a2e', sky3:'#103a38' },
    { grid:'#3e1a1a', accentA:'#ff3ea5', accentB:'#4ff2e0', sky1:'#100404', sky2:'#2e0c0c', sky3:'#3a1010' }
  ];

  // ---------- Player ----------
  const player = {
    x: PLAYER_X,
    y: GROUND_Y,
    w: 34, h: 46,
    vy: 0,
    onGround: true,
    sliding: false,
    slideTimer: 0,
    legPhase: 0,
    squash: 1
  };
  const SLIDE_H = 26;
  const SLIDE_DURATION = 0.45;

  // ---------- Input ----------
  let touchStartY = null;

  function tryJump(){
    if(state !== 'playing') return;
    if(player.onGround && !player.sliding){
      player.vy = JUMP_VELOCITY;
      player.onGround = false;
      spawnDust(player.x + player.w/2, GROUND_Y + player.h, 6);
    }
  }
  function trySlide(down){
    if(state !== 'playing') return;
    if(down){
      if(player.onGround){
        player.sliding = true;
        player.slideTimer = SLIDE_DURATION;
      }
    }
  }

  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space'){
      e.preventDefault();
      if(state === 'start'){ startGame(); }
      else if(state === 'playing'){ tryJump(); }
      else if(state === 'gameover'){ startGame(); }
    }
    if(e.code === 'ArrowDown'){
      e.preventDefault();
      trySlide(true);
    }
    if(e.code === 'KeyP'){
      togglePause();
    }
  });

  canvas.addEventListener('touchstart', (e)=>{
    touchStartY = e.touches[0].clientY;
    handlePrimaryInput();
  }, {passive:true});

  canvas.addEventListener('touchmove', (e)=>{
    if(touchStartY === null) return;
    const dy = e.touches[0].clientY - touchStartY;
    if(dy > 40){
      trySlide(true);
      touchStartY = null;
    }
  }, {passive:true});

  canvas.addEventListener('mousedown', ()=>{ handlePrimaryInput(); });

  function handlePrimaryInput(){
    if(state === 'start'){ startGame(); }
    else if(state === 'playing'){ tryJump(); }
    else if(state === 'gameover'){ /* handled by button */ }
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);

  function togglePause(){
    if(state === 'playing'){
      state = 'paused';
      document.getElementById('pauseScreen').classList.remove('hidden');
    } else if(state === 'paused'){
      state = 'playing';
      document.getElementById('pauseScreen').classList.add('hidden');
      lastTime = performance.now();
    }
  }

  // ---------- Obstacles ----------
  let obstacles = [];
  let spawnTimer = 0;
  let nextSpawnGap = 1.1;

  function spawnObstacle(){
    const roll = Math.random();
    let type;
    if(roll < 0.4) type = 'spike';       // ground spike, jump over
    else if(roll < 0.7) type = 'block';  // tall block, jump over
    else type = 'bar';                   // overhead bar, slide under

    let ob = { x: DESIGN_W + 20, type };

    if(type === 'spike'){
      ob.w = 28; ob.h = 32;
      ob.y = GROUND_Y + player.h - ob.h;
    } else if(type === 'block'){
      ob.w = 34; ob.h = 54;
      ob.y = GROUND_Y + player.h - ob.h;
    } else if(type === 'bar'){
      ob.w = 46; ob.h = 20;
      ob.y = GROUND_Y + player.h - SLIDE_H - 34;
    }
    obstacles.push(ob);
  }

  function spawnCoinCluster(){
    const count = 1 + Math.floor(Math.random()*3);
    const baseY = GROUND_Y - 40 - Math.random()*60;
    for(let i=0;i<count;i++){
      coins.push({
        x: DESIGN_W + 60 + i*30,
        y: baseY,
        r: 8,
        collected:false,
        bob: Math.random()*Math.PI*2
      });
    }
  }

  let coins = [];

  // ---------- Particles ----------
  let particles = [];
  function spawnDust(x,y,n){
    for(let i=0;i<n;i++){
      particles.push({
        x, y,
        vx: (Math.random()-0.5)*140,
        vy: -Math.random()*120,
        life: 0.4 + Math.random()*0.3,
        maxLife: 0.4 + Math.random()*0.3,
        r: 2 + Math.random()*2,
        color: 'cyan'
      });
    }
  }
  function spawnBurst(x,y,color){
    for(let i=0;i<22;i++){
      const angle = (Math.PI*2*i)/22;
      const spd = 140 + Math.random()*220;
      particles.push({
        x, y,
        vx: Math.cos(angle)*spd,
        vy: Math.sin(angle)*spd,
        life: 0.5 + Math.random()*0.4,
        maxLife: 0.5 + Math.random()*0.4,
        r: 2 + Math.random()*3,
        color
      });
    }
  }

  // ---------- Parallax layers ----------
  const stars = [];
  for(let i=0;i<60;i++){
    stars.push({ x: Math.random()*DESIGN_W, y: Math.random()*GROUND_Y*0.7, r: Math.random()*1.6+0.4, tw: Math.random()*Math.PI*2 });
  }
  const mountains = [];
  for(let i=0;i<8;i++){
    mountains.push({ x: i*160, w: 140+Math.random()*80, h: 60+Math.random()*70 });
  }
  let gridOffset = 0;
  let mountainOffset = 0;
  let starTwinkle = 0;

  // ---------- Game flow ----------
  function startGame(){
    state = 'playing';
    score = 0;
    speed = BASE_SPEED;
    elapsed = 0;
    obstacles = [];
    coins = [];
    particles = [];
    spawnTimer = 0;
    nextSpawnGap = 1.2;
    themeIndex = 0;
    player.y = GROUND_Y;
    player.vy = 0;
    player.onGround = true;
    player.sliding = false;
    player.slideTimer = 0;

    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.add('hidden');
    document.getElementById('pauseScreen').classList.add('hidden');
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('pauseBtn').style.display = 'flex';
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame(){
    state = 'gameover';
    if(score > best){
      best = score;
      document.getElementById('newBestTag').classList.remove('hidden');
    } else {
      document.getElementById('newBestTag').classList.add('hidden');
    }
    document.getElementById('finalScore').textContent = Math.floor(score);
    document.getElementById('finalBest').textContent = Math.floor(best);
    document.getElementById('gameOverScreen').classList.remove('hidden');
    document.getElementById('hud').style.display = 'none';
    document.getElementById('pauseBtn').style.display = 'none';
    shakeTime = 0.35;
    shakeMag = 14;
    spawnBurst(player.x+player.w/2, player.y+player.h/2, 'magenta');
  }

  // ---------- Collision ----------
  function getPlayerHitbox(){
    if(player.sliding){
      return { x: player.x, y: GROUND_Y + player.h - SLIDE_H, w: player.w, h: SLIDE_H };
    }
    return { x: player.x, y: player.y, w: player.w, h: player.h };
  }
  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  // ---------- Update ----------
  function update(dt){
    elapsed += dt;
    speed = Math.min(MAX_SPEED, BASE_SPEED + elapsed*SPEED_RAMP*10);
    score += dt * (speed/10);

    // theme shift every 400 points
    const desiredTheme = Math.floor(score/400) % THEMES.length;
    themeIndex = desiredTheme;

    // physics
    if(!player.onGround){
      player.vy += GRAVITY*dt;
      player.y += player.vy*dt;
      if(player.y >= GROUND_Y){
        player.y = GROUND_Y;
        player.vy = 0;
        player.onGround = true;
        player.squash = 1.25;
        spawnDust(player.x+player.w/2, GROUND_Y+player.h, 8);
      }
    }

    if(player.sliding){
      player.slideTimer -= dt;
      if(player.slideTimer <= 0){
        player.sliding = false;
      }
    }

    player.squash += (1-player.squash)*Math.min(1, dt*10);
    player.legPhase += dt * (player.onGround && !player.sliding ? speed*0.03 : 0);

    // spawn obstacles
    spawnTimer += dt;
    if(spawnTimer >= nextSpawnGap){
      spawnTimer = 0;
      spawnObstacle();
      if(Math.random() < 0.35) spawnCoinCluster();
      const difficulty = Math.min(1, elapsed/45);
      nextSpawnGap = (1.15 - difficulty*0.55) + Math.random()*0.5;
    }

    // move obstacles
    for(let i=obstacles.length-1;i>=0;i--){
      const ob = obstacles[i];
      ob.x -= speed*dt;
      if(ob.x + ob.w < -20){
        obstacles.splice(i,1);
        continue;
      }
      if(rectsOverlap(getPlayerHitbox(), ob)){
        endGame();
        return;
      }
    }

    // move coins
    for(let i=coins.length-1;i>=0;i--){
      const c = coins[i];
      c.x -= speed*dt;
      c.bob += dt*4;
      if(c.x < -20){ coins.splice(i,1); continue; }
      if(!c.collected){
        const hit = getPlayerHitbox();
        const cx = c.x, cy = c.y + Math.sin(c.bob)*4;
        if(cx > hit.x-10 && cx < hit.x+hit.w+10 && cy > hit.y-10 && cy < hit.y+hit.h+10){
          c.collected = true;
          score += 25;
          spawnBurst(cx, cy, 'amber');
          coins.splice(i,1);
        }
      }
    }

    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.life -= dt;
      if(p.life <= 0){ particles.splice(i,1); continue; }
      p.x += p.vx*dt;
      p.y += p.vy*dt;
      p.vy += 300*dt;
    }

    // parallax
    gridOffset = (gridOffset + speed*dt) % 40;
    mountainOffset = (mountainOffset + speed*dt*0.25) % 160;
    starTwinkle += dt;

    if(shakeTime > 0) shakeTime -= dt;

    document.getElementById('scoreVal').textContent = Math.floor(score);
    document.getElementById('bestVal').textContent = Math.floor(Math.max(best,score));
  }

  // ---------- Draw ----------
  function draw(){
    const theme = THEMES[themeIndex];

    ctx.save();
    if(shakeTime > 0){
      const dx = (Math.random()-0.5)*shakeMag*(shakeTime/0.35);
      const dy = (Math.random()-0.5)*shakeMag*(shakeTime/0.35);
      ctx.translate(dx,dy);
    }

    // sky
    const skyGrad = ctx.createLinearGradient(0,0,0,DESIGN_H);
    skyGrad.addColorStop(0, theme.sky1);
    skyGrad.addColorStop(0.55, theme.sky2);
    skyGrad.addColorStop(1, theme.sky3);
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0,0,DESIGN_W,DESIGN_H);

    // sun/moon glow
    ctx.save();
    const glowGrad = ctx.createRadialGradient(DESIGN_W*0.78, GROUND_Y*0.42, 10, DESIGN_W*0.78, GROUND_Y*0.42, 140);
    glowGrad.addColorStop(0, theme.accentB+'aa');
    glowGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(0,0,DESIGN_W,DESIGN_H);
    ctx.restore();

    // stars
    ctx.save();
    for(const s of stars){
      const tw = 0.5 + 0.5*Math.sin(starTwinkle*2 + s.tw);
      ctx.globalAlpha = tw*0.8;
      ctx.fillStyle = '#e8e2ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    // mountains (parallax layer)
    ctx.save();
    ctx.fillStyle = theme.sky3;
    ctx.globalAlpha = 0.8;
    for(const m of mountains){
      let mx = m.x - mountainOffset;
      while(mx < -m.w) mx += 160*8;
      drawMountain(mx, GROUND_Y+46, m.w, m.h);
      drawMountain(mx-160*8, GROUND_Y+46, m.w, m.h);
    }
    ctx.restore();

    // horizon glow line
    ctx.save();
    ctx.strokeStyle = theme.accentA;
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 2;
    ctx.shadowColor = theme.accentA;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y+46);
    ctx.lineTo(DESIGN_W, GROUND_Y+46);
    ctx.stroke();
    ctx.restore();

    // perspective grid floor
    drawGrid(theme);

    // coins
    for(const c of coins){
      const cy = c.y + Math.sin(c.bob)*4;
      ctx.save();
      ctx.translate(c.x, cy);
      ctx.fillStyle = theme.accentB === '#ffcb47' ? '#ffe27a' : '#ffcb47';
      ctx.shadowColor = '#ffcb47';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(0,0,c.r,0,Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#fff3c4';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }

    // obstacles
    for(const ob of obstacles){
      drawObstacle(ob, theme);
    }

    // player
    drawPlayer(theme);

    // particles
    for(const p of particles){
      const alpha = Math.max(0, p.life/p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color === 'magenta' ? theme.accentB : (p.color === 'amber' ? '#ffcb47' : theme.accentA);
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }

  function drawMountain(x,baseY,w,h){
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.lineTo(x+w*0.5, baseY-h);
    ctx.lineTo(x+w, baseY);
    ctx.closePath();
    ctx.fill();
  }

  function drawGrid(theme){
    ctx.save();
    ctx.strokeStyle = theme.grid;
    ctx.lineWidth = 1;

    // horizontal receding lines (simple parallel for stylized retro look)
    const floorH = DESIGN_H - (GROUND_Y+46);
    const rows = 8;
    for(let i=0;i<rows;i++){
      const t = i/rows;
      const y = (GROUND_Y+46) + t*t*floorH*1.4;
      if(y > DESIGN_H) continue;
      ctx.globalAlpha = 0.15 + t*0.5;
      ctx.beginPath();
      ctx.moveTo(0,y);
      ctx.lineTo(DESIGN_W,y);
      ctx.stroke();
    }

    // vertical lines scrolling
    ctx.globalAlpha = 0.35;
    const spacing = 40;
    for(let x = -gridOffset; x < DESIGN_W+spacing; x += spacing){
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y+46);
      ctx.lineTo(DESIGN_W/2 + (x-DESIGN_W/2)*2.2, DESIGN_H);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawObstacle(ob, theme){
    ctx.save();
    ctx.fillStyle = theme.accentB;
    ctx.shadowColor = theme.accentB;
    ctx.shadowBlur = 12;

    if(ob.type === 'spike'){
      ctx.beginPath();
      ctx.moveTo(ob.x, ob.y+ob.h);
      ctx.lineTo(ob.x+ob.w/2, ob.y);
      ctx.lineTo(ob.x+ob.w, ob.y+ob.h);
      ctx.closePath();
      ctx.fill();
    } else if(ob.type === 'block'){
      ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
      ctx.strokeStyle = '#fff';
      ctx.globalAlpha = 0.25;
      ctx.strokeRect(ob.x+3, ob.y+3, ob.w-6, ob.h-6);
    } else if(ob.type === 'bar'){
      ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
      // support posts hint
      ctx.globalAlpha = 0.5;
      ctx.fillRect(ob.x+2, ob.y+ob.h, 4, 30);
      ctx.fillRect(ob.x+ob.w-6, ob.y+ob.h, 4, 30);
    }
    ctx.restore();
  }

  function drawPlayer(theme){
    const hit = getPlayerHitbox();
    ctx.save();
    ctx.translate(hit.x + hit.w/2, hit.y + hit.h);
    ctx.scale(1/player.squash, player.squash);

    // body
    ctx.fillStyle = theme.accentA;
    ctx.shadowColor = theme.accentA;
    ctx.shadowBlur = 16;

    const w = hit.w, h = hit.h;
    ctx.fillRect(-w/2, -h, w, h*0.72);

    // head
    ctx.beginPath();
    ctx.arc(0, -h*0.85, w*0.34, 0, Math.PI*2);
    ctx.fill();

    // visor
    ctx.fillStyle = theme.sky1;
    ctx.fillRect(-w*0.22, -h*0.9, w*0.44, w*0.18);

    // legs (simple run cycle) — skip visual legs when sliding
    if(!player.sliding){
      ctx.strokeStyle = theme.accentA;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      const swing = Math.sin(player.legPhase) * (player.onGround ? 10 : 4);
      ctx.beginPath();
      ctx.moveTo(-w*0.15, -h*0.28);
      ctx.lineTo(-w*0.15+swing, 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(w*0.15, -h*0.28);
      ctx.lineTo(w*0.15-swing, 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  // ---------- Loop ----------
  function loop(now){
    if(state !== 'playing'){
      if(state === 'paused'){ requestAnimationFrame(loop); }
      return;
    }
    let dt = (now - lastTime)/1000;
    dt = Math.min(dt, 0.033); // clamp for stability
    lastTime = now;

    update(dt);
    draw();

    if(state === 'playing'){
      requestAnimationFrame(loop);
    } else if(state === 'gameover'){
      draw();
    }
  }

  // ---------- Idle background render on start screen ----------
  function idleDraw(){
    draw();
    if(state === 'start'){
      gridOffset = (gridOffset + 1.2) % 40;
      mountainOffset = (mountainOffset + 0.3) % 160;
      starTwinkle += 0.016;
      requestAnimationFrame(idleDraw);
    }
  }
  requestAnimationFrame(idleDraw);

})();
</script>
</body>
